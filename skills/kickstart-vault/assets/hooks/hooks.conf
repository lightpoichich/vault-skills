# Réglages des garde-fous du plugin second-cerveau (hooks H1 santé / H2 garde-fou écriture / H3 imports du vault / H4 rappel de sync).
# Fichier optionnel : sans lui, les défauts s'appliquent. Une clé par ligne, KEY=VALUE.

# Chemins relatifs à la racine du vault que les hooks ignorent (préfixes, séparés par des virgules).
# Typiquement : données opérationnelles importées, outillage. `_Meta/`, `.claude/`, `.obsidian/` le sont déjà.
# EXCLUDE=20-Areas/donnees-importees,outillage

# Ancienneté (jours) à partir de laquelle une note de 00-Inbox/ est signalée « qui traîne ».
INBOX_STALE_DAYS=14

# Mettre à 0 pour que le plugin n'approuve plus lui-même, dans ~/.claude.json, les imports de ce vault
# depuis une persona ou un dossier de travail (le dialogue interactif de Claude Code redevient la seule voie).
# APPROVE_EXTERNAL_IMPORTS=0

# Rappel de sync en fin de tour (H4) : quand le transcript de la session a grossi d'au moins SYNC_MIN_KB Ko
# ET que SYNC_MIN_MINUTES min se sont écoulées depuis le dernier sync, le hook Stop demande d'invoquer
# sync-vault, depuis le vault ou depuis un dossier de travail relié à une fiche projet.
SYNC_MIN_KB=40
SYNC_MIN_MINUTES=20
# SYNC_NUDGE=0 coupe le rappel ; SYNC_NUDGE=vault le garde depuis le vault seulement, pas depuis les dossiers de travail.
# SYNC_NUDGE=vault
# Depuis un worktree git lié (sous-agent de ticket), pas de rappel : l'orchestrateur synchronise une fois depuis
# le checkout principal. SYNC_NUDGE_WORKTREES=1 rétablit le rappel dans les worktrees.
# SYNC_NUDGE_WORKTREES=1

# Rotation des journaux de fiche : quand une fiche dépasse son budget de taille, ses entrées de journal les plus
# anciennes sortent mot pour mot vers {dossier}/journal/{slug}-{AAAA}-T{n}.md (hooks/vault-journal.py, lancé par
# sync-vault). Le bilan de démarrage signale les fiches au-dessus du budget, même rotation coupée.
JOURNAL_ROTATION=1
JOURNAL_MAX_KB_AREA=20
JOURNAL_MAX_KB_PROJECT=30
# Autres types (budget appliqué seulement aux fiches qui ont une section de journal) :
# JOURNAL_MAX_KB=30
# JOURNAL_MAX_KB_CLIENT=10
# Sections rotables, séparées par des virgules ; tout le reste de la fiche est protégé :
# JOURNAL_SECTIONS=Journal
# Entrées les plus récentes jamais déplacées, par section :
# JOURNAL_KEEP=5

# Mémoire native de Claude Code (MEMORY.md) : budget de l'index, environ 60 % du plafond réel (200 lignes, 25 000 caractères).
# MEMORY_MAX_KB se compte en milliers de caractères.
# Le bilan de démarrage signale le dépassement et le sensible apparent ; sync-vault cure la mémoire du vault.
# MEMORY_MAX_LINES=120
# MEMORY_MAX_KB=16
# MEMORY_CURATION_DAYS=30
