# Réglages des garde-fous du plugin second-cerveau (hooks H1 santé / H2 garde-fou écriture / H3 imports du vault / H4 rappel de sync).
# Fichier optionnel : sans lui, les défauts s'appliquent. Une clé par ligne, KEY=VALUE.

# Chemins relatifs à la racine du vault que les hooks ignorent (préfixes, séparés par des virgules).
# Typiquement : données opérationnelles importées, outillage. `_Meta/`, `.claude/`, `.obsidian/` le sont déjà.
# EXCLUDE=20-Areas/crm,pandoc

# Ancienneté (jours) à partir de laquelle une note de 00-Inbox/ est signalée « qui traîne ».
INBOX_STALE_DAYS=14

# Mettre à 0 pour que le plugin n'approuve plus lui-même, dans ~/.claude.json, les imports de ce vault
# depuis une persona ou un dossier de travail (le dialogue interactif de Claude Code redevient la seule voie).
# APPROVE_EXTERNAL_IMPORTS=0

# Rappel de sync en fin de tour (H4) : quand le transcript de la session a grossi d'au moins SYNC_MIN_KB Ko
# ET que SYNC_MIN_MINUTES min se sont écoulées depuis le dernier sync, le hook Stop demande d'invoquer
# sync-vault (depuis le vault) ou sync-repo (depuis un dépôt de code relié à une fiche projet).
SYNC_MIN_KB=40
SYNC_MIN_MINUTES=20
# SYNC_NUDGE=0 coupe le rappel ; SYNC_NUDGE=vault le garde depuis le vault seulement, pas depuis les dépôts.
# SYNC_NUDGE=vault
